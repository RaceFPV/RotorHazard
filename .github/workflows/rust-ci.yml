name: Rust CI

# Builds the Rust server and runs the full test suite on every push to the
# rust branch (and on PRs touching rust/). Produces release bundles as
# artifacts; tagged pushes also publish a GitHub release.

on:
  push:
    branches: [rust, main]
    tags: ['rh-server-rust-v*']
  pull_request:
    paths: ['rust/**', '.github/workflows/rust-ci.yml']
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('rust/server/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-test-

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libudev-dev

      - name: Build (release)
        run: cargo build --release --manifest-path rust/server/Cargo.toml

      - name: Unit tests
        run: cargo test --release --manifest-path rust/server/Cargo.toml --bins

      - name: Protocol integration tests
        run: cargo test --release --manifest-path rust/server/Cargo.toml --test protocol_core --test protocol_more --test protocol_autoadjust

  bundle:
    name: Release bundle (x86_64)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-bundle-${{ hashFiles('rust/server/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-bundle-

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libudev-dev

      - name: Build release bundle
        run: ./rust/build-release.sh "${{ github.ref_name }}"

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: rh-server-rust-${{ github.ref_name }}-x86_64
          path: dist/rh-server-rust-*.tar.gz
          if-no-files-found: error

  bundle-aarch64:
    name: Release bundle (aarch64 / Raspberry Pi)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Install aarch64 toolchain and libudev (multiarch)
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu pkg-config
          sudo dpkg --add-architecture arm64
          # pin the native repos to amd64 so apt ignores missing arm64 indexes
          sudo sed -i 's/^Types: deb$/Types: deb\nArchitectures: amd64/' /etc/apt/sources.list.d/ubuntu.sources
          sudo sed -i 's/^deb /deb [arch=amd64] /; s/^deb-src /deb-src [arch=amd64] /' /etc/apt/sources.list /etc/apt/sources.list.d/*.list 2>/dev/null || true
          sudo cp .github/arm64-sources.list /etc/apt/sources.list.d/arm64.list
          sudo apt-get update
          sudo apt-get install -y libudev-dev:arm64

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-aarch64-${{ hashFiles('rust/server/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-aarch64-

      - name: Build aarch64 bundle
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          PKG_CONFIG_ALLOW_CROSS: '1'
          PKG_CONFIG_PATH: /usr/lib/aarch64-linux-gnu/pkgconfig
          PKG_CONFIG_LIBDIR: /usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig
        run: ./rust/build-release.sh "${{ github.ref_name }}-aarch64"

      - name: Upload aarch64 bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: rh-server-rust-${{ github.ref_name }}-aarch64
          path: dist/rh-server-rust-*-aarch64.tar.gz
          if-no-files-found: error

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: [bundle, bundle-aarch64]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download bundles
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/rh-server-rust-*.tar.gz
          generate_release_notes: true
