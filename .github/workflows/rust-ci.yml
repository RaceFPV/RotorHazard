name: Rust CI

# Build and test ONLY. Nothing in this workflow packages, uploads or publishes;
# binaries and releases live in rust-release.yml. This is the gate that the
# release workflow calls before it builds anything.

on:
  push:
    branches: [rust, main]
    # Only Rust code (or this workflow) is worth a runner. Path filters are NOT
    # evaluated for tag pushes, so tags are handled by rust-release.yml anyway.
    paths: ['rust/**', '.github/workflows/rust-ci.yml']
  pull_request:
    paths: ['rust/**', '.github/workflows/rust-ci.yml']
  workflow_call: {}      # called by rust-release.yml as its test gate
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: rust-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-test-

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libudev-dev

      - name: Build (release)
        run: cargo build --release --manifest-path rust/server/Cargo.toml

      - name: Unit tests
        run: cargo test --release --manifest-path rust/server/Cargo.toml --bins

      - name: Protocol integration tests
        run: cargo test --release --manifest-path rust/server/Cargo.toml --test protocol_core --test protocol_more --test protocol_autoadjust
