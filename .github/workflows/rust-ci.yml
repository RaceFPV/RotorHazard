name: Rust CI

# Builds the Rust server and runs the full test suite on every push to the
# rust branch (and on PRs touching rust/). Produces release bundles as
# artifacts; tagged pushes also publish a GitHub release.

on:
  push:
    branches: [rust, main]
    tags: ['rh-server-rust-v*']
  pull_request:
    paths: ['rust/**', '.github/workflows/rust-ci.yml']
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-test-

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libudev-dev

      - name: Build (release)
        run: cargo build --release --manifest-path rust/server/Cargo.toml

      - name: Unit tests
        run: cargo test --release --manifest-path rust/server/Cargo.toml --bins

      - name: Protocol integration tests
        run: cargo test --release --manifest-path rust/server/Cargo.toml --test protocol_core --test protocol_more --test protocol_autoadjust

  bundle:
    name: Release bundle (x86_64)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-bundle-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-bundle-

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libudev-dev

      - name: Build release bundle
        run: ./rust/build-release.sh "${{ github.ref_name }}"

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: rh-server-rust-${{ github.ref_name }}-x86_64
          path: dist/rh-server-rust-*.tar.gz
          if-no-files-found: error

  bundle-aarch64:
    name: Release bundle (aarch64 / Raspberry Pi)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Install aarch64 compiler
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu pkg-config libudev-dev

      - name: Fetch arm64 libudev into a sysroot
        run: |
          # hermetic sysroot from ports.ubuntu.com -- no repo/multiarch changes
          source /etc/os-release
          SUITE="${VERSION_CODENAME:-noble}"
          MIRROR=http://ports.ubuntu.com/ubuntu-ports
          IDX=$(curl -fsSL "$MIRROR/dists/$SUITE/main/binary-arm64/Packages.gz" | zcat)
          get_file() {  # package name -> pool path
            echo "$IDX" | awk -v pkg="$1" '$0=="Package: " pkg {f=1} f && /^Filename: /{print $2; exit}'
          }
          mkdir -p arm64-sysroot
          for pkg in libudev1 libudev-dev; do
            fpath=$(get_file "$pkg")
            test -n "$fpath" || { echo "could not locate $pkg"; exit 1; }
            curl -fsSL "$MIRROR/$fpath" -o /tmp/$pkg.deb
            dpkg-deb -x /tmp/$pkg.deb arm64-sysroot
          done
          ls arm64-sysroot/usr/lib/aarch64-linux-gnu/pkgconfig/

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-aarch64-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-aarch64-

      - name: Build aarch64 bundle
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          PKG_CONFIG_ALLOW_CROSS: '1'
          # target-scoped: only the aarch64 build probes the sysroot; the
          # native x86_64 build (same script) keeps using host pkg-config
          PKG_CONFIG_SYSROOT_DIR_aarch64_unknown_linux_gnu: ${{ github.workspace }}/arm64-sysroot
          PKG_CONFIG_LIBDIR_aarch64_unknown_linux_gnu: ${{ github.workspace }}/arm64-sysroot/usr/lib/aarch64-linux-gnu/pkgconfig
        run: ./rust/build-release.sh "${{ github.ref_name }}-aarch64"

      - name: Upload aarch64 bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: rh-server-rust-${{ github.ref_name }}-aarch64
          path: dist/rh-server-rust-*-aarch64.tar.gz
          if-no-files-found: error

  bundle-windows:
    name: Release bundle (Windows x64)
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-bundle-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-bundle-

      - name: Build
        env:
          # no NASM on the runner: build OpenSSL without assembler
          OPENSSL_NO_ASM: '1'
        run: cargo build --release --manifest-path rust/server/Cargo.toml

      - name: Pack
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          New-Item -ItemType Directory -Force "dist/rh-server-rust-$tag-windows" | Out-Null
          Copy-Item rust/target/release/rh-server.exe "dist/rh-server-rust-$tag-windows/"
          Compress-Archive -Path "dist/rh-server-rust-$tag-windows" -DestinationPath "dist/rh-server-rust-$tag-windows.zip"

      - name: Upload Windows bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: rh-server-rust-${{ github.ref_name }}-windows-x64
          path: dist/rh-server-rust-*.zip
          if-no-files-found: error

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: [bundle, bundle-aarch64, bundle-windows]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download bundles
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/rh-server-rust-*.tar.gz
            dist/rh-server-rust-*.zip
          generate_release_notes: true
