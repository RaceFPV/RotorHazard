name: Upstream Sync

# Detects upstream changes to the ported Python files, merges them, ports the
# behavioral changes to Rust via an LLM, gates on tests, and pushes to `rust`.
#
# Placement matters: GitHub only loads `schedule` and `workflow_dispatch` from
# the repository's DEFAULT branch, and the default here is `main` while all
# work happens on `rust`. So this file lives on both branches and the job
# checks out `rust` explicitly. Do not delete the copy on `main` -- without it
# the schedule is never registered.
#
# Configuration:
#   secret  LLM_API_KEY     bearer token for the provider (OpenRouter by default)
#   var     LLM_BASE_URL    override the endpoint (default OpenRouter chat completions)
#   var     LLM_MODEL       override the model (default deepseek-v4.1-flash-1017)
#   var     LLM_MAX_TOKENS  output cap (default 64000)
#   var     LLM_REASONING_EFFORT  max|high|low|none; unset uses the
#           provider default, which is already "high" for
#           deepseek-v4.1-flash-1017
# Without LLM_API_KEY the run still merges upstream and pushes, and records
# "LLM port skipped" instead of porting.

on:
  schedule:
    - cron: '0 6 * * *'  # daily at 06:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Show the ported-file diff only (no merge, no port, no push)'
        type: boolean
        default: false
      smoke_llm:
        description: 'One real LLM call to verify key/model/validator (no merge, no push)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out rust branch
        uses: actions/checkout@v4
        with:
          ref: rust
          fetch-depth: 0  # full history: the port diff is computed from it
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure upstream remote and identity
        run: |
          git remote add upstream https://github.com/RotorHazard/RotorHazard.git || true
          git config user.name "upstream-sync-bot"
          git config user.email "sync@rotorhazard.local"

      - name: Verify we are on the rust branch
        run: |
          branch="$(git branch --show-current)"
          if [ "$branch" != "rust" ]; then
            echo "::error::checked out '$branch', expected 'rust'"
            exit 1
          fi

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system libraries (libudev for serialport)
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev pkg-config

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            rust/target
          key: ${{ runner.os }}-cargo-sync-${{ hashFiles('rust/server/Cargo.lock') }}

      - name: Install python client deps (cross-validation gate)
        run: python3 -m pip install --quiet 'python-socketio[client]' requests websocket-client

      - name: Tool self-tests (no network, no key needed)
        run: |
          python3 rust/tools/test_llm_call.py
          python3 rust/tools/test_validate_port.py
          python3 rust/tools/test_pipeline_stub.py

      - name: Guard - no credential committed
        run: |
          if git grep -nE 'sk-(or|ant)-v1-[A-Za-z0-9_-]{20,}' -- . ; then
            echo '::error::an API key appears to be committed to the tree'
            exit 1
          fi
          echo 'no key-shaped strings in the tree'

      - name: LLM smoke test (one real call)
        if: ${{ inputs.smoke_llm }}
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_MAX_TOKENS: ${{ vars.LLM_MAX_TOKENS }}
          LLM_REASONING_EFFORT: ${{ vars.LLM_REASONING_EFFORT }}
        run: python3 rust/tools/smoke_llm.py

      - name: Build server (the protocol suite runs the release binary)
        if: ${{ !inputs.smoke_llm }}
        run: cargo build --release --manifest-path rust/server/Cargo.toml

      - name: Run upstream sync
        if: ${{ !inputs.smoke_llm }}
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_MAX_TOKENS: ${{ vars.LLM_MAX_TOKENS }}
          LLM_REASONING_EFFORT: ${{ vars.LLM_REASONING_EFFORT }}
          SYNC_ARGS: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: |
          chmod +x rust/tools/upstream-sync.sh
          ./rust/tools/upstream-sync.sh ${SYNC_ARGS:-}

      - name: Report failure
        if: failure()
        run: |
          echo "::error::Upstream sync failed — the rust branch was rolled back to its pre-merge state"
          echo "Check the log for the failing gate: self-tests, fetch, merge, validation, cargo test, or the protocol suite."
