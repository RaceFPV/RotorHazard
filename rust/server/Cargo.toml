[package]
name = "rh-server"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.8"
socketioxide = { version = "0.16", features = ["state", "extensions"] }
tower = "0.5"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = "0.4"
rust-embed = { version = "8", features = ["include-exclude"] }
mime_guess = "2"
serialport = "4"
rust_socketio = "0.6"
# vendored: rust_engineio hard-depends on native-tls/openssl; building openssl
# from source removes the pkg-config/system-libssl requirement for all targets
openssl = { version = "0.10", features = ["vendored"] }
base64 = "0.22"
minijinja = { version = "2", features = ["urlencode", "json"] }
ureq = "3.5.2"

[dev-dependencies]
